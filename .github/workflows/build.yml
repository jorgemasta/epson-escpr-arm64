name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  ESCPR_VERSION: 1.8.8
  # Debian's orig tarball of Epson's GPL ESC/P-R driver, pinned by hash.
  ESCPR_URL: https://snapshot.debian.org/file/7af16f3335b1284ff350555cb2c60c459776d768
  ESCPR_SHA256: 8a0430d9d596fd8efa5dda6467ffa0ac06fd88be16544e486ac68eeb3d74defb
  # Where the filters live on the Mac; /usr/libexec/cups is SIP-protected.
  INSTALL_DIR: /Library/Printers/EPSON-escpr

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify source
        run: |
          curl -fsSL -o escpr.tar.gz "$ESCPR_URL"
          echo "$ESCPR_SHA256  escpr.tar.gz" | shasum -a 256 -c -
          tar -xzf escpr.tar.gz

      - name: Build (arm64, static libescpr)
        working-directory: epson-inkjet-printer-escpr-${{ env.ESCPR_VERSION }}
        run: |
          uname -m
          # Tarball timestamps make make re-run automake 1.16; regenerate with the runner's.
          brew install autoconf automake libtool
          autoreconf -fi
          # Fixes upstream wrapper bugs: shell injection and buffer overflows.
          patch -p1 < ../patches/0001-harden-wrapper.patch
          # Upstream calls a few undeclared functions, which clang rejects; declare them.
          sed -i '' 's|^#include "mem.h"$|#include "mem.h"\
          #include "err.h"|' src/mem.c
          sed -i '' 's|^#include "custompage.h"$|#include "custompage.h"\
          void obsClear(void);\
          EPS_ERR_CODE SetupJobAttrib(const EPS_JOB_ATTRIB*);\
          EPS_ERR_CODE SendStartJob(EPS_BOOL);\
          EPS_ERR_CODE PrintBand(const EPS_UINT8*, EPS_UINT32, EPS_UINT32*);|' src/filter.c
          sed -i '' 's|^#include "libprtX.h"$|#include "libprtX.h"\
          #include "custompage.h"|' src/wrapper.c
          # Fail loudly if a sed above stopped matching upstream.
          grep -q '^#include "err.h"$' src/mem.c
          grep -q '^EPS_ERR_CODE PrintBand(' src/filter.c
          grep -q '^#include "custompage.h"$' src/wrapper.c
          # Upstream gates its POSIX code on unix/__unix; Apple clang only defines __unix__.
          # Fortify and stack protector turn any remaining overflow into an abort.
          CPPFLAGS="-D__unix=1 -D_FORTIFY_SOURCE=2" \
          CFLAGS="-O2 -fstack-protector-strong" ./configure \
            --disable-shared --enable-static \
            --with-cupsfilterdir="$INSTALL_DIR/filter" \
            --with-cupsppddir="$INSTALL_DIR/ppd"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Stage package
        run: |
          src=epson-inkjet-printer-escpr-$ESCPR_VERSION
          mkdir -p out/filter out/ppd
          cp "$src/src/epson-escpr" "$src/src/epson-escpr-wrapper" out/filter/
          # CUPS only looks up bare filter names in its own SIP-protected dir.
          sed "s|^\*cupsFilter: \"application/vnd.cups-raster 0 epson-escpr-wrapper\"|*cupsFilter: \"application/vnd.cups-raster 0 $INSTALL_DIR/filter/epson-escpr-wrapper\"|" \
            "$src/ppd/Epson-ET-2710_Series-epson-escpr-en.ppd" > out/ppd/Epson-ET-2710_Series-epson-escpr-en.ppd
          grep -q "^\*cupsFilter: \"application/vnd.cups-raster 0 $INSTALL_DIR/filter/epson-escpr-wrapper\"$" out/ppd/*.ppd
          strings out/filter/epson-escpr-wrapper | grep -q "^$INSTALL_DIR/filter$"
          cp install.sh uninstall.sh out/
          cp "$src/COPYING" out/COPYING
          file out/filter/*
          otool -L out/filter/*
          (cd out && shasum -a 256 filter/* ppd/* install.sh uninstall.sh | tee SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epson-escpr-arm64-${{ env.ESCPR_VERSION }}
          path: out/

  release:
    # Artifacts expire and need a GitHub login; tagged builds get a stable public download.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: epson-escpr-arm64-${{ env.ESCPR_VERSION }}
          path: epson-escpr-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod 755 epson-escpr-arm64/filter/*
          zip -r epson-escpr-arm64.zip epson-escpr-arm64
          shasum -a 256 epson-escpr-arm64.zip > epson-escpr-arm64.zip.sha256
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file epson-escpr-arm64/SHA256SUMS \
            epson-escpr-arm64.zip epson-escpr-arm64.zip.sha256
